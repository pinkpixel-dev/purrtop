[package]
name = "purrtop"
version = "0.1.0"
edition = "2024"
description = "A colorful system monitor and task manager for Linux, built with GPUI Kit"
license = "Apache-2.0"
authors = ["Pink Pixel <admin@pinkpixel.dev>"]
repository = "https://github.com/pinkpixel-dev/purrtop"
publish = false

[dependencies]
gpui-kit = "0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
gpui-kit = { version = "0.7.1", features = ["test-support"] }

[package]
name = "purrtop"
version = "1.0.0"
edition = "2024"
description = "A colorful system monitor and task manager for Linux, built with GPUI Kit"
license = "Apache-2.0"
authors = ["Pink Pixel <admin@pinkpixel.dev>"]
repository = "https://github.com/pinkpixel-dev/purrtop"
homepage = "https://pinkpixel.dev"
readme = "README.md"
rust-version = "1.92"
keywords = ["system-monitor", "task-manager", "linux", "gpui", "process"]
categories = ["gui", "os::linux-apis"]
default-run = "purrtop"
# What `cargo build` needs (themes and the logo are embedded), plus the
# launcher, icons and polkit policy for anyone packaging it.
include = ["src/**/*", "themes/*.json", "data/**/*", "logo.png", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
gpui-kit = "0.7.1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "5"
futures-lite = "2"
rayon = "1"
nvml-wrapper = "0.13"

[dev-dependencies]
gpui-kit = { version = "0.7.1", features = ["test-support"] }

[profile.dev.package."*"]
opt-level = 3

[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true